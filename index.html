<!DOCTYPE html>  
<html lang="en">  
<head>  
<meta charset="UTF-8" />  
<meta name="viewport" content="width=device-width, initial-scale=1.0" />  
<title>Fortnite Sprite Viewer | Live Season</title>  
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230a0a0f' stroke='url(%23g)' stroke-width='3'/%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' style='stop-color:%2300f0ff'/%3E%3Cstop offset='100%25' style='stop-color:%23b400ff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ctext x='50' y='68' font-size='50' font-weight='bold' text-anchor='middle' fill='url(%23g)' font-family='sans-serif'%3EFS%3C/text%3E%3C/svg%3E" />  
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />  
<style>  
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }  
  body {  
    background: #0a0a0f;  
    color: #e8e8f0;  
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;  
    overflow-x: hidden;  
    min-height: 100vh;  
  }  
  ::-webkit-scrollbar { width: 8px; }  
  ::-webkit-scrollbar-track { background: #0a0a0f; }  
  ::-webkit-scrollbar-thumb { background: #3a3a5e; border-radius: 4px; }  
  ::-webkit-scrollbar-thumb:hover { background: #4a4a6e; }

  .glow-text { text-shadow: 0 0 20px rgba(0,240,255,0.5), 0 0 40px rgba(0,240,255,0.2); }  
  .glow-border { box-shadow: 0 0 15px rgba(0,240,255,0.15), inset 0 0 15px rgba(0,240,255,0.05); }

  .sprite-card {  
    transition: all 0.3s cubic-bezier(0.4,0,0.2,1);  
    cursor: pointer;  
  }  
  .sprite-card:hover {  
    transform: translateY(-4px) scale(1.02);  
    box-shadow: 0 0 30px rgba(0,240,255,0.25), 0 0 60px rgba(180,0,255,0.1);  
    border-color: #00f0ff;  
  }

  .rarity-common { border-left: 3px solid #9ca3af; }  
  .rarity-rare { border-left: 3px solid #3b82f6; }  
  .rarity-epic { border-left: 3px solid #a855f7; }  
  .rarity-legendary { border-left: 3px solid #f59e0b; }  
  .rarity-mythic { border-left: 3px solid #ef4444; }  
  .rarity-unreal { border-left: 3px solid #e2e2e2; }

  .nav-glass {  
    background: rgba(10,10,15,0.85);  
    backdrop-filter: blur(12px);  
    -webkit-backdrop-filter: blur(12px);  
    border-bottom: 1px solid rgba(0,240,255,0.1);  
  }

  .search-container {  
    background: linear-gradient(135deg, rgba(0,240,255,0.05), rgba(180,0,255,0.05));  
    border: 1px solid rgba(0,240,255,0.2);  
  }

  .btn-primary {  
    background: linear-gradient(135deg, #00f0ff, #b400ff);  
    transition: all 0.3s ease;  
  }  
  .btn-primary:hover {  
    transform: translateY(-2px);  
    box-shadow: 0 0 25px rgba(0,240,255,0.4), 0 0 50px rgba(180,0,255,0.2);  
  }  
  .btn-primary:active { transform: translateY(0); }

  .modal-overlay {  
    background: rgba(0,0,0,0.85);  
    backdrop-filter: blur(8px);  
    -webkit-backdrop-filter: blur(8px);  
  }

  /* Animated sprite frame cycling */  
  @keyframes spriteCycle {  
    0% { transform: translateX(0); }  
    100% { transform: translateX(-50%); }  
  }  
  .sprite-sheet-anim {  
    display: flex;  
    animation: spriteCycle 0.8s steps(1) infinite;  
    image-rendering: pixelated;  
  }

  @keyframes pulseGlow {  
    0%, 100% { box-shadow: 0 0 15px rgba(0,240,255,0.2); }  
    50% { box-shadow: 0 0 30px rgba(0,240,255,0.4), 0 0 60px rgba(180,0,255,0.15); }  
  }  
  .animate-pulse-glow { animation: pulseGlow 2s ease-in-out infinite; }

  @keyframes float {  
    0%, 100% { transform: translateY(0px); }  
    50% { transform: translateY(-8px); }  
  }  
  .animate-float { animation: float 3s ease-in-out infinite; }

  @keyframes fadeIn {  
    from { opacity: 0; } to { opacity: 1; }  
  }  
  @keyframes slideUp {  
    from { opacity: 0; transform: translateY(20px); }  
    to { opacity: 1; transform: translateY(0); }  
  }  
  .fade-in { animation: fadeIn 0.6s ease-out both; }  
  .slide-up { animation: slideUp 0.5s ease-out both; }

  .bg-grid {  
    background-image:  
      linear-gradient(rgba(0,240,255,0.03) 1px, transparent 1px),  
      linear-gradient(90deg, rgba(0,240,255,0.03) 1px, transparent 1px);  
    background-size: 40px 40px;  
  }

  .hero-bg {  
    background:  
      radial-gradient(ellipse at 20% 50%, rgba(0,240,255,0.08) 0%, transparent 50%),  
      radial-gradient(ellipse at 80% 50%, rgba(180,0,255,0.08) 0%, transparent 50%),  
      radial-gradient(ellipse at 50% 0%, rgba(0,240,255,0.06) 0%, transparent 40%);  
  }

  .toast {  
    animation: slideInRight 0.3s ease-out, fadeOut 0.3s ease-in 2.7s forwards;  
  }  
  @keyframes slideInRight {  
    from { transform: translateX(100%); opacity: 0; }  
    to { transform: translateX(0); opacity: 1; }  
  }  
  @keyframes fadeOut {  
    to { opacity: 0; transform: translateX(50%); }  
  }

  .filter-btn.active {  
    background: linear-gradient(135deg, #00f0ff, #b400ff);  
    color: #0a0a0f;  
    font-weight: 700;  
  }

  img { image-rendering: auto; }  
  .sprite-img { image-rendering: high-quality; }

  .loading-dots::after {  
    content: '';  
    animation: dots 1.5s steps(4, end) infinite;  
  }  
  @keyframes dots {  
    0% { content: ''; }  
    25% { content: '.'; }  
    50% { content: '..'; }  
    75% { content: '...'; }  
    100% { content: ''; }  
  }

  @media (max-width: 768px) {  
    .hero-title { font-size: 2rem !important; }  
    .gallery-grid { grid-template-columns: repeat(2, 1fr) !important; }  
  }

  @media (max-width: 480px) {  
    .gallery-grid { grid-template-columns: repeat(2, 1fr) !important; gap: 0.5rem !important; }  
  }  
</style>  
</head>  
<body class="bg-grid">

  <div id="mobile-menu" class="hidden md:hidden border-t border-gray-800 px-4 py-3 space-y-1">  
    <a href="/" onclick="navigate('/');toggleMobileMenu();" class="block px-4 py-3 rounded-lg text-sm font-medium text-gray-300 hover:text-white hover:bg-white/5">Home</a>  
    <a href="/viewer" onclick="navigate('/viewer');toggleMobileMenu();" class="block px-4 py-3 rounded-lg text-sm font-medium text-gray-300 hover:text-white hover:bg-white/5">Viewer</a>  
    <a href="/dashboard" onclick="navigate('/dashboard');toggleMobileMenu();" class="block px-4 py-3 rounded-lg text-sm font-medium text-gray-300 hover:text-white hover:bg-white/5">Dashboard</a>  
  </div>  
</nav>
