<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YT Sub Bot Dashboard</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #0f0f0f; color: #e0e0e0; padding: 1.5rem; max-width: 720px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin-bottom: 1rem; color: #ff0000; }
  h2 { font-size: 1.1rem; margin: 1.25rem 0 0.5rem; color: #ccc; }
  form { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1rem; }
  input, button { padding: 0.5rem 0.75rem; border-radius: 6px; border: 1px solid #333; background: #1a1a1a; color: #e0e0e0; font-size: 0.9rem; }
  button { background: #ff0000; border: none; cursor: pointer; color: #fff; font-weight: 600; }
  button:hover { background: #cc0000; }
  ul { list-style: none; padding: 0; }
  li { padding: 0.5rem 0; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }
  .channel { color: #fff; }
  .status { font-size: 0.8rem; padding: 0.15rem 0.5rem; border-radius: 4px; }
  .status.active { background: #1b5e20; color: #a5d6a7; }
  .status.inactive { background: #b71c1c; color: #ef9a9a; }
  .status.unknown { background: #333; color: #999; }
  .sub-count { font-size: 0.85rem; color: #aaa; }
  #msg { margin-top: 0.5rem; font-size: 0.85rem; }
  #msg.ok { color: #a5d6a7; }
  #msg.err { color: #ef9a9a; }
</style>
</head>
<body>

<h1>YT Sub Bot</h1>

<h2>Add Channel</h2>
<form id="addForm">
  <input type="text" id="channelId" placeholder="YouTube Channel ID" required>
  <input type="text" id="apiKey" placeholder="YouTube Data API Key" required>
  <button type="submit">Add Channel</button>
</form>
<div id="msg"></div>

<h2>Channels</h2>
<ul id="channelList"><li>Loading...</li></ul>

<script>
const API_BASE = '/.netlify/functions';

async function loadChannels() {
  const list = document.getElementById('channelList');
  const msg = document.getElementById('msg');
  try {
    const res = await fetch(API_BASE + '/orders');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (!data.orders || data.orders.length === 0) {
      list.innerHTML = '<li>No channels added yet.</li>';
      return;
    }
    list.innerHTML = '';
    data.orders.forEach(order => {
      const li = document.createElement('li');
      li.innerHTML = `
        <span class="channel">${esc(order.channelId)}</span>
        <span class="sub-count">Subs: ${order.subscriberCount != null ? order.subscriberCount : '—'}</span>
        <span class="status ${order.status || 'unknown'}">${order.status || 'unknown'}</span>
      `;
      list.appendChild(li);
    });
  } catch (e) {
    list.innerHTML = '<li>Failed to load channels.</li>';
    msg.textContent = 'Error: ' + e.message;
    msg.className = 'err';
  }
}

document.getElementById('addForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('msg');
  const channelId = document.getElementById('channelId').value.trim();
  const apiKey = document.getElementById('apiKey').value.trim();
  msg.textContent = 'Adding...';
  msg.className = '';
  try {
    const res = await fetch(API_BASE + '/subscribe', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ channelId, apiKey })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Failed');
    msg.textContent = 'Channel added successfully.';
    msg.className = 'ok';
    document.getElementById('addForm').reset();
    loadChannels();
  } catch (err) {
    msg.textContent = 'Error: ' + err.message;
    msg.className = 'err';
  }
});

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

loadChannels();
</script>

</body>
</html>
